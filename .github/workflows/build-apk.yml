name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK (ANDROID_HOME); just accept licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: watch-gaming-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchGamingManager.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WatchGamingManager.apk --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Debug build from ${GITHUB_SHA::7}. Install on your Android phone (Android 11+)."
      - name: Store APK on the apk-builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp WatchGamingManager.apk /tmp/out/ && cd /tmp/out
          git init -q -b apk-builds && git add WatchGamingManager.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
